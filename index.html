<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>参政党 愛知9区支部 チラシ配布MAP</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="配布MAP">
<link rel="stylesheet" href="style.css?v=20260907202725">
</head>
<body>

<div id="app">
  <!-- 上部バー -->
  <header id="topbar">
    <div class="row">
      <button id="btnMenu" class="icon" aria-label="メニュー">☰</button>
      <div id="title">参政党 愛知9区支部 チラシ配布MAP</div>
      <button id="btnSearch" class="icon" aria-label="場所を検索">🔍</button>
      <select id="periodSel" aria-label="期間">
        <option value="all">全期間</option>
        <option value="30" selected>直近30日</option>
        <option value="7">直近7日</option>
      </select>
    </div>
    <div id="flyerChips" class="chips"></div>
  </header>

  <div id="noticeBanner" hidden></div>

  <!-- 場所の検索 -->
  <div id="searchBox" hidden>
    <div class="searchRow">
      <input id="searchInp" type="search" placeholder="町名・地名・施設名・お店（ひらがな可）" autocomplete="off" enterkeyhint="search">
      <button id="searchGo" class="primary">検索</button>
      <button id="searchClose" class="icon">✕</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- 地図（描画レイヤーと同じ枠） -->
  <div id="mapWrap">
  <div id="map"></div>

  <!-- なぞり描きレイヤー -->
  <div id="drawLayer" hidden>
    <canvas id="drawCanvas"></canvas>
    <div id="drawHint">配った範囲を指でなぞって囲んでください</div>
    <div id="drawModes">
      <button id="modeFree" class="seg on">なぞる</button>
      <button id="modeTap" class="seg">点で囲む</button>
    </div>
    <div id="drawButtons">
      <button id="btnDrawCancel" class="ghost">中止</button>
      <button id="btnDrawRedo" class="ghost">やり直し</button>
      <button id="btnDrawUndo" class="ghost" hidden>戻る</button>
      <button id="btnDrawDone" class="primary" disabled>決定</button>
    </div>
  </div>

  <!-- 掲示場モードのバー -->
  <div id="boardBar" hidden>
    <div class="boardBarRow">
      <span id="boardStat"></span>
      <select id="boardKindSel" aria-label="表示する種類"><option value="all">両方</option><option value="official">掲示場のみ</option><option value="general">一般ポスターのみ</option></select>
      <button id="btnBoardAdd" class="ghost">＋ 場所を追加</button>
      <button id="btnBoardList" class="ghost">一覧</button>
      <button id="btnBoardClose" class="ghost">✕ 閉じる</button>
    </div>
    <div id="boardAddHint" hidden>ポスターを貼る場所を地図でタップしてください　<button id="btnBoardAddCancel" class="ghost small">やめる</button></div>
  </div>

  <!-- 拠点・辻立ちモードのバー -->
  <div id="spotBar" hidden>
    <div class="boardBarRow">
      <span id="spotStat"></span>
      <button id="btnSpotAdd" class="ghost">＋ 場所を追加</button>
      <button id="btnSpotList" class="ghost">予定・実績</button>
      <button id="btnSpotClose" class="ghost">✕ 閉じる</button>
    </div>
    <div id="spotAddHint" hidden>事務所や辻立ちの場所を地図でタップしてください　<button id="btnSpotAddCancel" class="ghost small">やめる</button></div>
  </div>

  <!-- 形の調整（つまみ） -->
  <div id="adjustBar" hidden>
    <div id="adjustHint">白い四角を動かすと形を直せます（辺の途中の四角で角を増やせます）</div>
    <div class="adjustButtons">
      <button id="btnAdjustCancel" class="ghost">中止</button>
      <button id="btnAdjustOk" class="primary">この形で次へ</button>
    </div>
  </div>
  <!-- 凡例（地図の左上、タグの下） -->
  <button id="legendBtn" title="枚数・凡例">▤</button>
  <div id="legend" hidden></div>
  <!-- 大きなズームボタン -->
  <div id="zoomBtns"><button id="zoomIn" aria-label="拡大">＋</button><button id="zoomOut" aria-label="縮小">−</button></div>
  <button id="svBtn" title="画面中央のストリートビューを開く" aria-label="ストリートビュー"><svg viewBox="0 0 40 60" width="30" height="45" aria-hidden="true"><g fill="#f9b825" stroke="#6b4e00" stroke-width="1.5" stroke-linejoin="round"><circle cx="20" cy="10" r="8"/><path d="M12 20 h16 q4 0 4 4 v14 h-4 v-6 h-2 v22 h-5 v-14 h-2 v14 h-5 v-22 h-2 v6 h-4 v-14 q0-4 4-4z"/></g><g fill="#3b2a00"><circle cx="17" cy="9" r="1.3"/><circle cx="23" cy="9" r="1.3"/></g><path d="M16.5 13 q3.5 3 7 0" fill="none" stroke="#3b2a00" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  <div id="centerMark" aria-hidden="true">＋</div>
  </div><!-- /mapWrap -->


  <!-- 記録ボタン -->
  <button id="fab">＋ 配布を記録</button>


  <!-- サイドメニュー -->
  <nav id="menu" hidden>
    <div class="menuHead">
      <div id="menuUser"></div>
      <button id="btnMenuClose" class="icon">✕</button>
    </div>
    <button class="menuItem" data-view="list">📋 配布一覧・CSV</button>
    <button class="menuItem" data-view="towns">🏘 町丁目ごとの配布率</button>
    <button class="menuItem" id="btnBoards">📌 ポスター掲示場（看板）</button>
    <button class="menuItem" id="btnSpots">🎤 拠点・辻立ちスポット</button>
    <button class="menuItem" data-view="settings">⚙ 設定（チラシ・メンバー・告示日）</button>
    <button class="menuItem" id="btnSwitchUser">👤 名前を変える</button>
    <div class="menuFoot">
      地図 © Google ／ 町丁目境界・世帯数：政府統計の総合窓口(e-Stat) 令和2年国勢調査 小地域境界データを加工
    </div>
  </nav>

  <!-- ボトムシート（汎用） -->
  <div id="sheet" hidden>
    <div id="sheetHandle"></div>
    <div id="sheetBody"></div>
  </div>

  <!-- ログイン -->
  <div id="login" hidden>
    <div class="loginBox">
      <h1>参政党 愛知9区支部 チラシ配布MAP</h1>
      <p id="loginMsg">あなたの名前を選んでください</p>
      <p class="small" id="loginSub" hidden>合言葉は、配布のとりまとめ役から受け取ってください</p>
      <div id="loginPass" hidden>
        <label>合言葉<input id="inpPass" type="password" autocomplete="off"></label>
      </div>
      <label>名前<select id="selName"></select></label>
      <label id="newNameWrap" hidden>新しい名前<input id="inpNewName" type="text" placeholder="例：野口"></label>
      <button id="btnLogin" class="primary">はじめる</button>
      <p class="loginErr" id="loginErr"></p>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>

<script src="config.js?v=20260907202725"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<script src="app.js?v=20260907202725"></script>
</body>
</html>
